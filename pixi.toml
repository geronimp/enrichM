fuzzywuzzy = ">=0.18.0,<0.19"
six = ">=1.17.0,<2"
scikit-learn = ">=1.7.1,<2"
decorator = ">=5.2.1,<6"
pytest = ">=8.4.1,<9"
r = ">=4.4,<4.5"
pyarrow = ">=21.0.0,<22"

[pypi-dependencies]
pyrodigal = ">=3.6.3.post1, <4"
ipython = ">=9.4.0, <10"
polars = ">=1.32.3, <2"
