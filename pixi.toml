[workspace]
authors = ["Joel <joel.anthonyb@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "enrichM"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
ENRICHM_DB = "/work/microbiome/db/enrichm/enrichm_database_v12/"

[tasks]
pipeline = { cmd = "python scripts/pipeline.py", description = "Run the full enrichm annotate -> enrichment pipeline end to end (see --help for --genome_dir/--metadata/--annotation/etc.)" }
nmf_heatmap = { cmd = "python scripts/plot_nmf_heatmap.py", description = "Plot a group-annotated heatmap of per-genome NMF scores from an 'enrichment --decompose' run (see --help for --scores/--metadata/--output)" }

subset-data = { cmd = "python scripts/subset_genomes.py", description = "Build a fast test subset (3 genomes/Faecalibacterium group + the Gemmiger genome) from data/genomes + data/groups.tsv", inputs = ["data/genomes", "data/groups.tsv", "scripts/subset_genomes.py"], outputs = ["data/genomes_subset", "data/groups_subset.tsv"] }
annotate = { cmd = "python bin/enrichm annotate --genome_directory data/genomes_subset --ko_hmm --threads 8 --output data/pipeline_output_subset/annotate_output --force", depends-on = ["subset-data"], description = "Run enrichm annotate (KO HMMs) on the 7-genome data/ subset", inputs = ["data/genomes_subset"], outputs = ["data/pipeline_output_subset/annotate_output"] }
enrichment = { cmd = "python bin/enrichm enrichment --annotate_output data/pipeline_output_subset/annotate_output --metadata data/groups_subset.tsv --ko_hmm --output data/pipeline_output_subset/enrichment --force", depends-on = ["annotate"], description = "Run enrichm enrichment (KO HMMs) comparing the Faecalibacterium/Gemmiger groups in the data/ subset", inputs = ["data/pipeline_output_subset/annotate_output", "data/groups_subset.tsv"], outputs = ["data/pipeline_output_subset/enrichment"] }
classify = { cmd = "python bin/enrichm classify --genome_and_annotation_matrix data/pipeline_output_subset/annotate_output/ko_hmm_frequency_table.tsv --output data/pipeline_output_subset/classify --force", depends-on = ["annotate"], description = "Run enrichm classify (KEGG module completeness) on the annotate output for the data/ subset", inputs = ["data/pipeline_output_subset/annotate_output"], outputs = ["data/pipeline_output_subset/classify"] }

[dependencies]
diamond = "*"
hmmer = ">=3.4,<4"
parallel = "*"
prodigal = "*"
mmseqs2 = "*"
python = "3.*"
certifi = ">=2024"
python-dateutil = ">=2.9.0.post0,<3"
statsmodels = ">=0.14.5,<0.15"
numpy = ">=2.3.2,<3"
pandas = ">=2.3.2,<3"
scipy = ">=1.16.1,<2"
biopython = ">=1.85,<2"
fuzzywuzzy = ">=0.18.0,<0.19"
six = ">=1.17.0,<2"
scikit-learn = ">=1.7.1,<2"
decorator = ">=5.2.1,<6"
pytest = ">=8.4.1,<9"
r = ">=4.4,<4.5"
pyarrow = ">=21.0.0,<22"
dendropy = ">=5.0.8,<6"
matplotlib = ">=3.10.8,<4"

[pypi-dependencies]
pyrodigal = ">=3.6.3.post1, <4"
ipython = ">=9.4.0, <10"
polars = ">=1.32.3, <2"
