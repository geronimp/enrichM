[workspace]
authors = ["Joel <joel.anthonyb@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "enrichM"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
diamond = "*"
hmmer = ">=3.4,<4"
parallel = "*"
prodigal = "*"
mmseqs2 = "*"
python = "3.*"
python-dateutil = ">=2.9.0.post0,<3"
statsmodels = ">=0.14.5,<0.15"
numpy = ">=2.3.2,<3"
pandas = ">=2.3.2,<3"
scipy = ">=1.16.1,<2"
